<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Gen 3</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/media.css">
</head>

<body onload="onInit()">
    <div class="main-layout">
        <header class="flex space-around full">
            <h2 class="logo">Meme Gen 3</h2>
            <nav class="nav-bar">
                <ul class="clean-list flex">
                    <li onclick="openGallery()">Gallery</li>
                    <li>Memes</li>
                    <li>About</li>
                </ul>
            </nav>
        </header>

        <main class="grid-container">

            <section class="gallery">
                <div class="gallery-container"></div>
            </section>


            <section class="editor hidden">
                <div class="canvas-container">
                    <canvas width="400" height="400"></canvas>
                </div>

                <div class="controls ">
                    <div class="line-btns">
                        <button onclick="onAddLine()">Add Line</button>
                        <button onclick="onSwitchLine()">Switch Line</button>
                        <button onclick="onDeleteLine()">Delete Line</button>
                    </div>
                    <div class="line-btns">
                        <button onclick="onAlignLeft()">Align Left</button>
                        <button onclick="onAlignCenter()">Align Center</button>
                        <button onclick="onAlignRight()">Align Right</button>
                    </div>

                    <label for="font-family">Font Family:</label>
                    <select name="font-family" id="font-family" onchange="onChangeFont(this.value)">
                        <option value="Impact" selected>Impact</option>
                        <option value="Arial" >Arial</option>
                        <option value="Times New Roman">Times New Roman</option>
                    </select>

                    <label for="txt">Text:</label>
                    <input type="text" id="txt" oninput="onSetLineText(this.value)">

                    <label for="color">Color:</label>
                    <input type="color" oninput="onSetColor(this.value)">

                    <label for="font-size">Font Size:</label>
                    <div id="font-size">
                        <button onclick="onChangeSize(1)">▲</button>
                        <button onclick="onChangeSize(-1)">▼</button>
                    </div>
                    <!-- <label for="dwn-btn">Download:</label> -->
                    <!-- <button id="dwn-btn">Click here!</button> -->
                    <!-- <a href="#" id="dwn-link" onclick="onDownloadImg(this)" download="file-name">Download Meme</a> -->
                    <button id="dwn-link" onclick="onDownloadImg()">Download Meme</button>
                </div>
            </section>
        </main>
    </div>
    <script src="js/util.service.js"></script>
    <script src="js/meme.service.js"></script>
    <script src="js/meme.controller.js"></script>
    <script src="js/gallery.controller.js"></script>
</body>

</html>
